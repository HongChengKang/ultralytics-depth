# detdist 训练配置：这里只写「覆盖脚本默认值」的项。
#
# 覆盖顺序：  脚本 DEFAULTS  <  本文件  <  命令行 (--key value 或 key=value)
# 默认值表（imgsz / project / name / batch / lr0 / dist_lambda ... 全部）在
#   hzh_workspace/tools/train/train_detdist.py  顶部 DEFAULTS
# 想确认最终生效值：tools/train/train_detdist.py --dry-run
#
# 常用覆盖示例（取消注释即生效）：
#   name: dist_pf_all_2          # 换 run 名 -> runs/<name>/
#   epochs: 100
#   imgsz: [640, 384]            # (H, W)
#   batch: 64
#   device: "1"
#   dist_lambda: 0.3             # 0 = 只训检测（baseline）
#   labels_root: /mnt/data2/hzh/PF_11.9/labels_dist
#
# 说明：mosaic / mixup / cutmix / copy_paste / degrees / shear / perspective 会被
# libs/detdist/data.py 强制置 0（破坏「像素框 ↔ 距离」对应），写在这里也无效。
