# detdist dataset definition — the ONE place that names the dataset.
#
# Change `dataset_root` only; then run:
#   tools/data/make_data_yaml.py            # rewrites configs/detdist_data.yaml
#   tools/data/make_data_yaml.py --smoke    # also writes the 20-image smoke lists
#
# The trainer reads images from <dataset_root>/<split_images> and labels from
# <dataset_root>/<labels_dist>, so different roots for images / labels are fine.

dataset_root: /mnt/data2/hzh/PF_11.9

train_images: images/train
val_images: images/val
labels_dist: labels_dist          # 6 columns: cls cx cy w h d_norm

names:
  0: person
  1: Fertilizer bag
